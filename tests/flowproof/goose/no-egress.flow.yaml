# STATUS: BLOCKED, does not record yet. Under egress containment goose cannot
# reach flowproof's OWN model proxy on loopback:
#     Network error: Could not connect to 127.0.0.1:35035
# The documented contract says loopback is exempt wholesale, so this flow is
# committed as the reproduction, NOT as a passing test. See D5 in ../LOOP.md.
# Do not "fix" it by adding allow_egress entries: loopback is supposed to need
# none, and declaring what the contract exempts would hide the finding.
#
# LINUX ONLY. `assert_no_egress` is a capability claim: on macOS and Windows
# it fails outright rather than passing vacuously, so this flow is CI-only and
# CI must run it on Linux.
#
# The claim goose users cannot make today: this agent reached nothing off this
# host. goose runs third-party MCP servers on your machine, so "it only talked
# to the model" is worth being able to prove rather than assume.
#
# There is deliberately NO allow_egress. Loopback is exempt wholesale, so the
# model proxy needs no entry, and every other destination is denied. Anything
# goose reaches for beyond the proxy - telemetry, an update check, a registry -
# fails this flow, which is the point.
name: goose reaches nothing off this host
app: agent
agent:
  # See smoke.flow.yaml for why IFS= and the frozen clock are needed.
  command: sh -c "IFS=; exec goose run --no-session --no-profile -t $FLOWPROOF_PROMPT"
  env:
    GOOSE_PROVIDER: openai
    GOOSE_MODEL: claude-opus-5
    LD_PRELOAD: /usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
    FAKETIME: "2026-01-01 00:00:00"
    FAKETIME_DONT_FAKE_MONOTONIC: "1"
steps:
  - prompt: What is the capital of France? Reply with just the city name.
  # LIVENESS FIRST. assert_no_egress alone passes for an agent that crashed on
  # startup and opened no sockets at all. This asserts the agent actually ran
  # and answered, so the certification below is about a real trajectory.
  - assert: reply contains Paris
  # The guard: the set of undeclared destinations the agent attempted is empty.
  - assert_no_egress
