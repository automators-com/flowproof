# Phase 0c corpus - negative control #2. A different failure shape from
# the sibling negative control: asserts a screen title that will never
# appear anywhere in this real launchpad, right after a correct login.
# Must fail. Scored inverted by scripts/fiori-eval.py: this spec PASSES
# the eval only when flowproof correctly reports it broken.
name: Home page shows an impossible screen title (must fail)
app: web
url: ${FIORI_BASE_URL}?sap-client=${FIORI_CLIENT}&sap-language=${FIORI_LANGUAGE}#Shell-home
steps:
  - Type ${FIORI_USER} into the "User" field
  - Type ${FIORI_PASSWORD} into the "Password" field
  - Press the "Log On" button
  - Wait until page shows Home within 60s
  # Wrong on purpose: no real screen in this tenant is titled this -
  # this assertion must not hold.
  - assert: page shows Nonexistent Report Configuration Screen XYZ123
