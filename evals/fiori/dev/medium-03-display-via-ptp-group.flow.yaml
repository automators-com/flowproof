# Phase 0c corpus - medium flow #3. The same real record as medium-01, but
# reached through the "PTP Process Area BU Apps" group tile instead of
# directly from Home - a different navigation depth (Home -> group ->
# sub-tile -> app) exercising the same underlying search screen. This is
# the flow the group-tile ambiguity noted in
# examples/fiori/purchase-info-records-report.flow.yaml's own TODO forces
# every spec that goes through the group to resolve at record time.
name: Display info record by supplier - via the PTP group tile
app: web
url: ${FIORI_BASE_URL}?sap-client=${SAP_CLIENT}&sap-language=${SAP_LANGUAGE}#Shell-home
steps:
  - Type ${SAP_USER} into the "User" field
  - Type ${SAP_PASSWORD} into the "Password" field
  - Press the "Log On" button
  - Wait until page shows Home within 60s
  - Click "PTP Process Area BU Apps"
  - assert: page shows Display purchasing info records by Supplier
  - Click "Display purchasing info records by Supplier"
  - "Wait until page shows Info Records per Supplier within 20s"
  - Type ${SUPPLIER} into the "Supplier" in the iframe "Application"
  - Type ${MATERIAL} into the "Material" in the iframe "Application"
  - Press Enter
  - assert: the "Material" field in the iframe "Application" contains ${MATERIAL}
