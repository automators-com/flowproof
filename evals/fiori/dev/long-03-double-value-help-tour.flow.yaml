# Phase 0c corpus - long flow #3 (30+ steps, crosses 4+ real screens,
# exercises value help on BOTH search fields in one screen visit rather
# than one). Same overall shape as the other two long specs, varied again:
# both value-help dialogs open in sequence on the Display screen before
# searching, and the flow closes with three independent out-of-band OData
# checks instead of two.
#
# Views crossed: Home (launchpad) -> Info Records per Supplier (search
# screen) -> the Supplier field's value-help dialog -> the Material
# field's value-help dialog -> Home again -> Initial Screen (Change app)
# -> General Data (Change app, on a match).
#
# CORRECTED after the corpus's first baseline run: originally reached the
# Change app through a "PTP Process Area BU Apps" group tile that does not
# exist on this account's real Home page (see short-02's own correction
# note and docs/fiori-reliability/FINDINGS.md). Rewritten to use the
# direct Home tile instead. Also dropped the two explicit "Clear the ...
# field" steps before opening value help - the same baseline run separately
# found that phrasing loses its iframe scope in the deterministic
# rule_step path (medium-05-search-retry-after-no-match.flow.yaml carries
# that finding on its own now); opening value help directly over an
# already-wrong value needs no prior clear.
name: Double value-help tour - both search fields, then Change read only
app: web
url: ${FIORI_BASE_URL}?sap-client=${SAP_CLIENT}&sap-language=${SAP_LANGUAGE}#Shell-home
steps:
  # -- Login ----------------------------------------------------------
  - Type ${SAP_USER} into the "User" field
  - Type ${SAP_PASSWORD} into the "Password" field
  - Press the "Log On" button
  - Wait until page shows Home within 90s
  - assert: page shows Display Purchasing Info Record by Supplier
  - assert: page shows Change Purchasing Info Record

  # -- App 1: Display, wrong search then BOTH fields via value help ---
  - Click "Display Purchasing Info Record by Supplier"
  - "Wait until page shows Info Records per Supplier within 20s"
  - Type DOES-NOT-EXIST into the "Supplier" in the iframe "Application"
  - Type DOES-NOT-EXIST into the "Material" in the iframe "Application"
  - Press Enter
  - assert: page shows Info Records per Supplier
  - Open the value help for the Supplier field in the iframe "Application"
  - Select ${SUPPLIER} from the value help list
  - Open the value help for the Material field in the iframe "Application"
  - Select ${MATERIAL} from the value help list
  - Press Enter
  - assert: the "Supplier" field in the iframe "Application" contains ${SUPPLIER}
  - assert: the "Material" field in the iframe "Application" contains ${MATERIAL}

  # -- Back to the launchpad, mid-flow ---------------------------------
  - Navigate to ${FIORI_BASE_URL}?sap-client=${SAP_CLIENT}&sap-language=${SAP_LANGUAGE}#Shell-home
  - Wait until page shows Home within 60s
  - assert: page shows Change Purchasing Info Record

  # -- App 2: Change, read only ----------------------------------------
  - Click "Change Purchasing Info Record"
  - assert: page shows Initial Screen
  - Type ${MATERIAL} into the "Material" field
  - Type ${SUPPLIER} into the "Supplier" field
  - Type ${PLANT} into the "Plant" field
  - Type ${PURCHASING_ORG} into the "Purchasing Organization" field
  - Press the "Go" button
  - assert: page shows General Data
  - assert: the "Material" field in the iframe "Application" contains ${MATERIAL}

  # -- Out-of-band truth, three ways -----------------------------------
  - assert_api:
      request: GET ${SAP_ODATA_BASE}/MM_PUR_INFO_RECORDS_MANAGE_SRV/C_PurInfoRecordWithOrg?$filter=Material%20eq%20'${MATERIAL}'%20and%20Plant%20eq%20'${PLANT}'%20and%20Supplier%20eq%20'${SUPPLIER}'
      headers:
        Authorization: Basic ${SAP_ODATA_BASIC_AUTH}
      status: 200
      body_contains: ${MATERIAL}
  - assert_api:
      request: GET ${SAP_ODATA_BASE}/MM_PUR_INFO_RECORDS_MANAGE_SRV/C_PurInfoRecordWithOrg?$filter=Material%20eq%20'${MATERIAL}'
      headers:
        Authorization: Basic ${SAP_ODATA_BASIC_AUTH}
      status: 200
      body_contains: ${SUPPLIER}
  - assert_api:
      request: GET ${SAP_ODATA_BASE}/MM_PUR_INFO_RECORDS_MANAGE_SRV/C_PurInfoRecordWithOrg?$filter=Plant%20eq%20'${PLANT}'
      headers:
        Authorization: Basic ${SAP_ODATA_BASIC_AUTH}
      status: 200
      body_contains: ${MATERIAL}
