# Phase 0c corpus - long flow #2 (30+ steps, crosses 4+ real screens,
# includes a value-help dialog). Same overall shape as
# long-01-cross-app-tour.flow.yaml, deliberately varied: opens with an
# out-of-band API canary before touching the browser at all (if the record
# itself is gone, this fails in the first step instead of thirty steps in),
# exercises value help on the Material field instead of Supplier, and adds
# a third real app (Procurement Overview) between the other two purely as
# navigation - touched, confirmed self-titled, then left.
#
# Views crossed: Home (launchpad) -> Info Records per Supplier (search
# screen) -> the Material field's value-help dialog -> Home again ->
# Procurement Overview -> Home again -> Initial Screen (Change app) ->
# General Data (Change app, on a match).
#
# CORRECTED after the corpus's first baseline run: originally reached both
# apps through a "PTP Process Area BU Apps" group tile that does not exist
# on this account's real Home page (see short-02's own correction note and
# docs/fiori-reliability/FINDINGS.md). Rewritten around tiles confirmed
# real, using the same direct-tile-plus-mid-flow-Navigate pattern
# long-01/03 already prove works, with Procurement Overview standing in
# for the extra navigation depth the group tile would have added.
name: Cross-app tour with an API canary - value help on Material
app: web
url: ${FIORI_BASE_URL}?sap-client=${FIORI_CLIENT}&sap-language=${FIORI_LANGUAGE}#Shell-home
steps:
  # -- Canary: confirm the record exists before spending any UI steps -
  - assert_api:
      request: GET ${SAP_ODATA_BASE}/MM_PUR_INFO_RECORDS_MANAGE_SRV/C_PurInfoRecordWithOrg?$filter=Material%20eq%20'${MATERIAL}'%20and%20Plant%20eq%20'${PLANT}'%20and%20Supplier%20eq%20'${SUPPLIER}'
      headers:
        Authorization: Basic ${SAP_ODATA_BASIC_AUTH}
      status: 200
      body_contains: ${MATERIAL}

  # -- Login ----------------------------------------------------------
  - Type ${FIORI_USER} into the "User" field
  - Type ${FIORI_PASSWORD} into the "Password" field
  - Press the "Log On" button
  - Wait until page shows Home within 90s
  - assert: page shows Display Purchasing Info Record by Supplier
  - assert: page shows Procurement Overview

  # -- App 1: Display, wrong search then value help on Material -------
  - Click "Display Purchasing Info Record by Supplier"
  - "Wait until page shows Info Records per Supplier within 20s"
  - Type ${SUPPLIER} into the "Supplier" in the iframe "Application"
  - Type DOES-NOT-EXIST into the "Material" in the iframe "Application"
  - Press Enter
  - assert: page shows Info Records per Supplier
  - Open the value help for the Material field in the iframe "Application"
  - Select ${MATERIAL} from the value help list
  - Press Enter
  - assert: the "Supplier" field in the iframe "Application" contains ${SUPPLIER}
  - assert: the "Material" field in the iframe "Application" contains ${MATERIAL}

  # -- App 2, purely navigation: touch it, confirm it, leave -----------
  - Navigate to ${FIORI_BASE_URL}?sap-client=${FIORI_CLIENT}&sap-language=${FIORI_LANGUAGE}#Shell-home
  - Wait until page shows Home within 60s
  - Click "Procurement Overview"
  - Wait until page shows Procurement Overview within 20s

  # -- App 3: Change, read only -----------------------------------------
  - Navigate to ${FIORI_BASE_URL}?sap-client=${FIORI_CLIENT}&sap-language=${FIORI_LANGUAGE}#Shell-home
  - Wait until page shows Home within 60s
  - assert: page shows Change Purchasing Info Record
  - Click "Change Purchasing Info Record"
  - assert: page shows Initial Screen
  - Type ${MATERIAL} into the "Material" field
  - Type ${SUPPLIER} into the "Supplier" field
  - Type ${PLANT} into the "Plant" field
  - Type ${PURCHASING_ORG} into the "Purchasing Organization" field
  - Press the "Go" button
  - assert: page shows General Data
  - assert: the "Material" field in the iframe "Application" contains ${MATERIAL}

  # -- Out-of-band truth, again, from a different filter shape ---------
  - assert_api:
      request: GET ${SAP_ODATA_BASE}/MM_PUR_INFO_RECORDS_MANAGE_SRV/C_PurInfoRecordWithOrg?$filter=Plant%20eq%20'${PLANT}'
      headers:
        Authorization: Basic ${SAP_ODATA_BASIC_AUTH}
      status: 200
      body_contains: ${MATERIAL}
