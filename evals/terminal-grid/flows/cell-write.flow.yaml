# Fill cells by column header and row: the cell is emptied first, so a
# shorter value does not keep the old tail.
name: Fill cells by column and row
app: vision
window: Host screen (replica)
steps:
  - Type XB99 into the "Stufe" column of the row containing "001"
  - Type 7 into the "KZ" column of the row containing "003"
  - assert: the "Stufe" column of the row containing "001" shows XB99
