# TEMPORARY, throwaway workflow — not part of the normal CI suite. Exists
# only to hand a Windows flowproof.exe to a developer whose own machine
# cannot compile the workspace (out of RAM on `headless_chrome`). Uploads
# one artifact, does nothing else. Delete this file once the binary has
# been downloaded.
#
# Triggered on push (scoped to this one throwaway branch), not
# workflow_dispatch: GitHub only lets workflow_dispatch runs be requested
# for a workflow that already exists on the repo's default branch, and this
# workflow is deliberately never going there.
name: scratch build cli (temporary)

on:
  push:
    branches: [chore/scratch-build-cli]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p flowproof-cli
      - uses: actions/upload-artifact@v4
        with:
          name: flowproof-windows
          path: target/release/flowproof.exe
          retention-days: 3
