# The Adversary: the review that stands between a loop and `main`.
#
# It is a workflow rather than a bot account deliberately. Its logic lives in
# .github/workflows/, which is constitution-protected AND unreachable by a loop
# token lacking `workflow` scope - so the Builder cannot influence what reviews
# it. A machine account's prompt would sit in a mutable file; this does not.
#
# Measured, not assumed: a github-actions[bot] approval satisfies the ruleset's
# required_approving_review_count: 1, and an approval is dismissed by a later
# push. See CHARTER.md section 9.
#
# FAIL-CLOSED. Approval is the exception, not the default. Every path that is not
# an explicit pass leaves the pull request unapproved, and unapproved means
# unmergeable for any identity that cannot bypass the ruleset.
#
# SCOPE TODAY: mechanical only. The concept's four model-driven lenses
# (correctness, gate-integrity, API-compat, docs-truth) need an ANTHROPIC_API_KEY
# that this repository does not have, and shipping an untested model call as a
# merge gate would be worse than shipping none. The extension point is marked
# below, and the review body states plainly what was and was not checked - an
# approval must never imply more scrutiny than actually happened.
name: adversary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  # The loop identity whose pull requests this reviews. Hardcoded in a protected
  # path on purpose: a loop cannot add itself, and cannot point this at someone
  # else. Human pull requests are never auto-approved - humans bypass the ruleset
  # anyway, so approving for them would add risk and no convenience.
  BUILDER: AutomatorsAgent

jobs:
  adversary:
    name: adversary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gate's own tests run before the gate does. A ratchet that has never
      # refused anything is indistinguishable from one that cannot.
      - name: the ratchets' own tests
        run: ./scripts/gate/ratchets.test.sh

      - name: ratchets
        id: ratchets
        continue-on-error: true
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/gate/ratchets.sh | tee /tmp/ratchets.out

      - name: verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          RATCHETS: ${{ steps.ratchets.outcome }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$AUTHOR" != "$BUILDER" ]; then
            echo "author '$AUTHOR' is not the loop Builder; no automated verdict"
            exit 0
          fi

          body_head="**Adversary — mechanical review**

          Checked: the gate is no weaker after this change (test counts, \`#[ignore]\`,
          \`skip\`/\`xfail\`, cassette immutability, schema/doc coupling, diff size).

          _Not_ checked: whether the change is **correct**, whether the docs are
          **true**, or whether the public API stayed compatible. Those are the
          model-driven lenses and they are not wired up yet, so treat this approval
          as \"the gate still measures what it did before\" and nothing more."

          if [ "$RATCHETS" = "success" ]; then
            gh pr review "$PR" --repo "$REPO" --approve --body "$body_head"
            echo "approved"
          else
            gh pr review "$PR" --repo "$REPO" --request-changes --body "$body_head

          ---

          **Refused.** This change would leave the gate weaker than it found it:

          \`\`\`
          $(cat /tmp/ratchets.out 2>/dev/null || echo 'ratchets produced no output - treat as a refusal')
          \`\`\`

          Getting to green by weakening what measures green is never the fix."
            echo "changes requested"
            exit 1
          fi
