name: osv-scanner

# Known vulnerabilities in every dependency tree we ship or develop against:
# the Rust workspace (Cargo.lock) and the Python SDK (sdk/python/uv.lock),
# checked against osv.dev, which aggregates RustSec, GitHub, PyPA and other
# advisory databases. Rust licence and source policy is cargo-deny's job
# (audit.yml).
#
# Not scanned: examples/fiori/fixture (a test fixture) and
# spike/windows-containment (an experiment). Neither ships. sdk/js has no
# lockfile; its dependencies are our own platform binaries.
#
# What leaves the runner: dependency names and versions, sent to
# api.osv.dev. No source code.
#
# Any known vulnerability fails the check. A finding that cannot be fixed
# yet goes in osv-scanner.toml with a reason, never silently.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Mondays, 05:00 UTC, the same quiet hour as audit.yml. A new advisory
    # can be published with nothing changing on our side.
    - cron: "0 5 * * 1"

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scan:
    name: osv-scanner
    # Google's reusable workflow, pinned to a release. security-events: write
    # publishes the results to the repository's Security tab (code scanning
    # is free on a public repository).
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=Cargo.lock
        --lockfile=sdk/python/uv.lock
