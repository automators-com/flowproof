name: Publish to npm

on:
  workflow_dispatch:
  # A tag publishes. The pattern is exact rather than `v*` so a stray or
  # experimental tag cannot ship a release by accident, and the guard below
  # refuses a tag that names a version different from the one it would build.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  guard:
    name: version is new on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must name the version it builds
        # Only meaningful on a tag push; a manual dispatch has no tag to check.
        #
        # This exists because it already happened: a `v0.14.0` tag was created
        # on the commit that bumps to 0.15.0. Nothing consumed tags then, so it
        # was merely wrong in the history. Once a tag publishes, the same
        # mistake ships 0.15.0 to the world labelled 0.14.0 — and registry
        # versions are immutable, so there is no taking it back.
        if: github.event_name == 'push'
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' would publish version '$version' — they must agree (tag v$version, or bump to ${GITHUB_REF_NAME#v})"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $version"

      - name: Fail fast if versions skew or the version is already published
        run: |
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          npm_version=$(node -p "require('./sdk/js/package.json').version")
          if [ "$cargo_version" != "$npm_version" ]; then
            echo "::error::version mismatch — Cargo.toml $cargo_version vs sdk/js/package.json $npm_version (also sync optionalDependencies)"; exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/flowproof/$npm_version")
          case "$code" in
            404) echo "flowproof $npm_version not on npm yet — proceeding" ;;
            200) echo "::error::flowproof $npm_version already on npm — bump the version first"; exit 1 ;;
            *)   echo "::error::unexpected HTTP $code from the npm registry — refusing to guess"; exit 1 ;;
          esac

  binaries:
    name: build + publish ${{ matrix.pkg }}
    needs: guard
    strategy:
      # The platform packages are SCOPED (@automators/...) because the
      # unscoped names were not publishable: npm answered
      #   403 - Package name triggered spam detection
      # for `flowproof-cli-darwin-x64` and `flowproof-cli-win32-x64` on every
      # attempt, a heuristic that fires on brand-new unscoped names. Two legs
      # stuck there permanently, and since `publish` needs this job, the
      # launcher itself never shipped - which is why npm sat at the 0.0.1
      # placeholder while PyPI was at 0.5.0. Names under an existing org are
      # not subject to that heuristic.
      #
      # Each leg still publishes independently: one failing (a flaky runner,
      # a registry hiccup) must not cancel the others, or a partial publish
      # strands the rest. With the skip-if-already-published guard below, a
      # re-run converges on whatever is still missing.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg: "@automators/flowproof-cli-linux-x64"
            os_field: linux
            cpu_field: x64
            bin: flowproof
          # CROSS-COMPILED from Apple Silicon, not built on an Intel mac.
          # `macos-13` is the Intel image, and it stopped being schedulable:
          # a 0.6.0 publish sat QUEUED on it for over two hours with no
          # runner ever assigned, which blocked the launcher below (it
          # `needs` every leg) and left npm on its placeholder. Cross
          # compiling costs one rustup target and removes the dependency on
          # a runner we do not control the supply of.
          - os: macos-latest
            pkg: "@automators/flowproof-cli-darwin-x64"
            os_field: darwin
            cpu_field: x64
            target: x86_64-apple-darwin
            bin: flowproof
          - os: macos-latest
            pkg: "@automators/flowproof-cli-darwin-arm64"
            os_field: darwin
            cpu_field: arm64
            bin: flowproof
          - os: windows-latest
            pkg: "@automators/flowproof-cli-win32-x64"
            os_field: win32
            cpu_field: x64
            bin: flowproof.exe
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Add the cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Build the CLI binary
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p flowproof-cli --target ${{ matrix.target }}
          else
            cargo build --release -p flowproof-cli
          fi
      - name: Assemble the platform package
        shell: bash
        run: |
          version=$(node -p "require('./sdk/js/package.json').version")
          os_field='${{ matrix.os_field }}'
          cpu_field='${{ matrix.cpu_field }}'
          mkdir -p dist-npm
          # A cross build lands under target/<triple>/release, not target/release.
          built="target/release/${{ matrix.bin }}"
          if [ -n "${{ matrix.target }}" ]; then
            built="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          fi
          cp "$built" dist-npm/
          # Prove the binary is actually the architecture we are about to
          # publish as: a silently-native build would install and then fail
          # to exec on the user's machine.
          file dist-npm/${{ matrix.bin }} || true
          node -e "
            const fs = require('fs');
            fs.writeFileSync('dist-npm/package.json', JSON.stringify({
              name: '${{ matrix.pkg }}',
              version: '$version',
              description: 'flowproof CLI native binary for ' + '$os_field' + '-' + '$cpu_field',
              os: ['$os_field'],
              cpu: ['$cpu_field'],
              files: ['${{ matrix.bin }}'],
              repository: { type: 'git', url: 'git+https://github.com/automators-com/flowproof.git' },
              license: 'Apache-2.0'
            }, null, 2));
          "
      - name: Publish the platform package
        working-directory: dist-npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          # npm versions are immutable: republishing one that already exists
          # is a hard 409. On a re-run (e.g. after a spam hold clears on one
          # platform), skip the packages already at this version so the run
          # can finish the missing ones instead of failing on the done ones.
          published=$(npm view "${{ matrix.pkg }}@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "${{ matrix.pkg }}@$version is already published, skipping"
          else
            npm publish --access public --provenance
          fi

  publish:
    name: publish flowproof
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        working-directory: sdk/js
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "flowproof@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "flowproof@$version is already published, skipping"
          else
            npm publish --access public --provenance
          fi
