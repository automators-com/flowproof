name: npx smoke test

# The npm launcher is what most new users now touch first, and it is the one
# artifact CI could not previously see: `cargo test` proves the engine, not
# the published package. This installs flowproof FROM npm on all three
# platforms exactly as a newcomer would, and runs it.
#
# It deliberately tests the PUBLISHED package rather than the checkout, so it
# catches things a repo-local test cannot: a missing platform binary, a wrong
# os/cpu field, a corrupt tarball, a binary built for the wrong architecture.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to smoke test (default: latest)"
        required: false
        default: "latest"
  schedule:
    # Daily. A published package can break without anyone pushing a commit:
    # npm can serve a bad tarball, or a platform package can go missing.
    - cron: "0 6 * * *"

jobs:
  npx:
    name: npx flowproof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # NOT macos-13. The Intel macOS image stopped being schedulable (a
        # publish sat queued on it for over two hours with no runner), so a
        # job asking for it would hang rather than report. That leaves ONE
        # honest gap: darwin-x64 is verified by architecture at publish time
        # (`file` reports Mach-O x86_64) but is never EXECUTED in CI. Add it
        # back the day Intel macOS runners are schedulable again.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Sparse checkout of only the composite action definition, not the
      # crates or a Cargo/npm build tree: the "no checkout" property this
      # workflow relies on is about never having a local copy of the
      # PACKAGE that could mask a broken publish. Fetching the .yml that
      # defines the shared steps doesn't touch that guarantee.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/npm-smoke-steps
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Shared with release-smoke.yml (.github/actions/npm-smoke-steps) so
      # the daily/latest check and the exact-version release gate can never
      # drift into testing different things.
      - uses: ./.github/actions/npm-smoke-steps
        with:
          version: ${{ inputs.version || 'latest' }}
