name: secret-scan

# gitleaks over the full git history: a password, key or token committed by
# accident (#306). Flows, fixtures and examples sit next to app credentials.
#
# The CLI, not gitleaks-action: the action needs a paid licence key for
# organisation repos, the MIT-licensed CLI does not. Pinned and checked
# against the release's SHA-256.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 05:00 UTC, with the dependency checks.
    - cron: "0 5 * * 1"

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      # --redact keeps any finding's value out of the log.
      - name: Scan the history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
