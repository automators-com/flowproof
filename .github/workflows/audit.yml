name: audit

# Rust dependency policy (audit issue A6): licences, banned crates and allowed
# sources, configured in deny.toml. Known vulnerabilities moved to
# osv-scanner.yml, which covers Rust and Python in one place.
#
# A standalone workflow, not a job in ci.yml, for two reasons: it matches the
# repo's pattern of keeping focused checks separate (secret-scan.yml,
# osv-scanner.yml), and it needs its own schedule. A crate can be yanked
# or relicensed with zero change on our side, so the weekly cron is the backstop
# that catches that case even when nothing merges.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Mondays, 05:00 UTC — a quiet hour, same as the nightly CI cron.
    - cron: "0 5 * * 1"

# A newer push to the same branch makes the previous answer worthless; runs
# on main are never cancelled (they gate releases), matching ci.yml.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  policy:
    name: cargo-deny licences, bans, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check licenses bans sources
