# Advisory caller: publishes feature PR packages and syncs reviewer/lifecycle state with Operator.
# Advisory only: nothing here gates a merge.
name: Operator PR package

on:
  pull_request:
    types: [opened, ready_for_review, synchronize,
            review_requested, review_request_removed, closed]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    uses: automators-com/engineering-workflows/.github/workflows/operator-pr-package.yml@main
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number) }}
    secrets:
      OPERATOR_ENGINEERING_TOKEN: ${{ secrets.OPERATOR_ENGINEERING_TOKEN }}
