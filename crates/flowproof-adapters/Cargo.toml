[package]
name = "flowproof-adapters"
description = "Native application adapters (SAP GUI Scripting COM, browser via CDP) behind feature flags"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
sap-com = ["dep:windows"]
web = ["dep:headless_chrome"]
# Pixels-only (Citrix/RDP) driving: OCR perception via ocrs/rten, model
# download via ureq.
vision = ["dep:ocrs", "dep:rten", "dep:ureq"]
# Agent-boundary testing: the model-API proxy, and record mode forwarding
# to a real model over ureq (TLS via platform-verifier, already in-tree).
# `dep:windows` is listed for the Windows containment probe; the dependency
# itself is declared under [target.'cfg(windows)'.dependencies], so enabling
# this feature on Linux or macOS pulls nothing.
agent = ["dep:ureq", "dep:windows"]

[dependencies]
anyhow = { workspace = true }
flowproof-driver = { workspace = true }
flowproof-trace = { workspace = true }
headless_chrome = { version = "1", optional = true }
serde = { workspace = true }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
thiserror = { workspace = true }
ocrs = { version = "0.12", optional = true }
# Must track the rten version ocrs builds against (models are versioned).
rten = { version = "0.24", optional = true }
ureq = { version = "3", features = ["platform-verifier"], optional = true }

# Egress containment (`app: agent`) is a Linux-only, unprivileged seccomp
# user-notification supervisor. `libc` is pure Rust (no C library to link),
# so a non-Linux build never pulls it and a cross `cargo check --target
# x86_64-unknown-linux-gnu` type-checks the module off a Mac. The BPF filter
# is hand-built: seccompiler builds classic-BPF filters but its actions do
# not include SECCOMP_RET_USER_NOTIF, which this design requires.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    # StructuredStorage gates the VARIANT -> BSTR conversions.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    # Windows egress containment (`agent`): the capability probe reads the
    # process token's elevation and privileges, and asks the SCM whether the
    # Secondary Logon service exists. The per-run identity creates a local
    # account (NetManagement), resolves its SID (Security_Authorization) and
    # takes its credential from the system RNG (Security_Cryptography).
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    # Starting the agent as that identity: a kill-on-close job so a grandchild
    # cannot outlive the run, and the window-station/desktop grant without
    # which CreateProcessAsUserW cannot start a process at all.
    "Win32_System_JobObjects",
    "Win32_System_StationsAndDesktops",
], optional = true }

[lints]
workspace = true
