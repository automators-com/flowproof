[package]
name = "flowproof-agent"
description = "Recording agent: planner loop with pluggable computer-use model backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
flowproof-driver = { workspace = true, features = ["oob"] }
flowproof-trace = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "3", features = ["platform-verifier", "json"] }
uuid = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# A real HTTP server for the model-client tests: the request flowproof
# actually puts on the wire is the thing under test, so a mock client would
# prove nothing about it.
tiny_http = "0.12"
