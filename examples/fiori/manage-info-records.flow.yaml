# SAP Fiori: navigate into a purchasing info record via the "Change
# Purchasing Info Record" app and confirm it loads, read-only.
#
# Originally recorded as an edit-and-save flow (Net Price + Minimum Order
# Quantity via Save), but that would mean writing to a live, shared
# reference-system record on every CI run with no undo - unlike
# standard-text/create-revise-delete.flow.yaml's SAP GUI counterpart, which
# creates and deletes its own throwaway record, this app has no
# create-a-scratch-record path, so any edit here permanently steers a
# pre-existing record's values on a schedule nobody else consented to.
# Deliberately narrowed to navigation + a read-only OData confirmation
# instead - proves login, tile navigation, the search screen, and record
# lookup all still work live, without ever writing.
#
# Confirmed live: "Wait until page shows X within Ns" resolves a specific
# element whose own text equals X exactly - it's not a page-wide substring
# search. "Initial Screen"/"General Data" are only fragments of compound
# headings ("Change Info Record: Initial Screen"/"...General Data"), not
# any element's own full text, so that form can't match them. Plain
# `assert: page shows X` does a full-page substring check instead, which
# does match here.
#
# The record's own field values render inside the embedded classic SAP GUI
# transaction (a same-origin iframe named "Application", same as the
# sibling display-info-record-by-supplier.flow.yaml) - page-text
# assertions can't see into it, hence the explicit iframe-scoped field
# grammar for the Material check below.
name: Manage info records - view record details
app: web
url: ${FIORI_BASE_URL}?sap-client=${FIORI_CLIENT}&sap-language=${FIORI_LANGUAGE}#Shell-home
steps:
  - Type ${FIORI_USER} into the "User" field
  - Type ${FIORI_PASSWORD} into the "Password" field
  - Press the "Log On" button
  - Wait until page shows "My Apps" within 120s
  - assert: page shows Change Purchasing Info Record
  - Click "Change Purchasing Info Record"
  - assert: page shows Initial Screen
  - Type ${MATERIAL} into the "Material" field
  - Type ${SUPPLIER} into the "Supplier" field
  - Type ${PLANT} into the "Plant" field
  # The screen hard-blocks with "Please also enter a purchasing organization"
  # without this - confirmed live, not optional on this reference system.
  - Type ${PURCHASING_ORG} into the "Purchasing Organization" field
  - Press the "Go" button
  # A unique Material+Supplier+Plant+Purchasing Org match navigates straight
  # into the record's own screen, not a results list.
  - assert: page shows General Data
  - the "Material" field in the iframe "Application" contains ${MATERIAL}

  # -- Out-of-band truth: the same record as SAP's OData sees it, read-only --
  # Basic auth header (not session cookies) rather than raw credentials in a
  # header value - same pattern as purchasing-info-record-api.flow.yaml.
  - assert_api:
      request: GET ${SAP_ODATA_BASE}/MM_PUR_INFO_RECORDS_MANAGE_SRV/C_PurInfoRecordWithOrg?$filter=Material%20eq%20'${MATERIAL}'%20and%20Plant%20eq%20'${PLANT}'%20and%20Supplier%20eq%20'${SUPPLIER}'
      headers:
        Authorization: Basic ${SAP_ODATA_BASIC_AUTH}
      status: 200
      body_contains: ${MATERIAL}
