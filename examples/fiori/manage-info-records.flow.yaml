# SAP Fiori: change a purchasing info record and verify it — the classic
# "PTP Process Area BU Apps → Manage Info Records" test case, expressed in
# flowproof's ordinary web grammar. Fiori is a browser app, so `app: web`
# (the CDP driver); `app: sap` is SAP GUI (desktop) only.
#
# Every value that is test DATA travels as a ${VAR} reference: it resolves
# from the environment at record AND replay, and only the raw `${VAR}` is
# ever stored in the trace. The sibling suite.yaml mints these vars via
# mint-test-data.sh (env_from) before any flow runs — so the flow always
# targets a Material/Supplier/Plant combination that really exists in the
# connected SAP system.
#
# Quoted TARGETS ("Material", "Go", …) are text anchors matched against
# labels/aria-labels/placeholders — they never resolve ${VAR}. Label
# wording here is representative of a standard Fiori theme; if your
# system's labels differ, record with --json and the clarification payload
# will list the real fields on screen (see docs/self-help.md).
#
# The launchpad URL itself carries sap-client/sap-language as query params
# — confirmed live: hitting the base URL alone 404s post-login on a real
# system, because the shell's actual bootstrap path only resolves once
# client/language are present on the request, not guessed at as a path
# suffix. FIORI_* rather than SAP_* deliberately: `flowproof config sap` and
# `flowproof config fiori` are two independent profiles (a real deployment's
# Fiori identity can differ from its SAP GUI one, e.g. an SSO-fronted
# launchpad), so a shared name would let one silently overwrite the other's
# env var (plans/001-credential-config.md, "Two profiles, not one identity").
name: Manage info records - edit and verify
app: web
url: ${FIORI_BASE_URL}?sap-client=${FIORI_CLIENT}&sap-language=${FIORI_LANGUAGE}#Shell-home
steps:
  # -- Log in on the launchpad's login screen --------------------------
  - Type ${FIORI_USER} into the "User" field
  - Type ${FIORI_PASSWORD} into the "Password" field
  - Press the "Log On" button
  # Confirmed live against a real system via login-smoke.flow.yaml: "Home"
  # resolves from the shell's own tab label once authenticated, regardless
  # of whether the account has any tiles assigned.
  - Wait until page shows Home within 60s

  # This flow is still UNRECORDED past this point. A live attempt against
  # the reference system's OBEVA account failed here: `Click "PTP Process
  # Area BU Apps"` has no matching tile — confirmed via three independent
  # navigation surfaces (Home page, the shell's "All My Apps" panel, and
  # Enterprise Search under the Apps category all show zero apps for this
  # account). That's a backend Fiori catalog/PFCG-role gap, not a flow
  # defect: OBEVA has no Launchpad role assigned yet, separate from
  # whatever SAP GUI/backend authorization it holds. Needs a Basis/Fiori
  # admin to assign the catalog behind ZMM_PUR_INFO_RECORDS_MANAGE_SRV_0001
  # ("Manage Purchasing Info Records") before this flow can be recorded.

  # -- Navigate: module tile, then the app -----------------------------
  - Click "PTP Process Area BU Apps"
  - Click "Manage Info Records"
  - assert: page shows Manage Purchasing Info Records

  # -- Search the standard info record by the minted test data ---------
  - Type ${MATERIAL} into the "Material" field
  - Type ${SUPPLIER} into the "Supplier" field
  - Type ${PLANT} into the "Plant" field
  - Press the "Go" button
  - assert: page shows ${MATERIAL}

  # -- Open the record and make the field changes ----------------------
  # This is the expansion of the manual script's vague "make required
  # field changes": each field is named concretely. The first result row
  # is addressed via the css escape hatch (targets don't resolve ${VAR},
  # so the row can't be clicked "by material number").
  - Click the 1st "css:.sapMListItems .sapMLIB"
  - Press the "Edit" button
  - Replace the "Net Price" field with ${NET_PRICE}
  - Replace the "Minimum Order Quantity" field with 10

  # -- Save ------------------------------------------------------------
  - Press the "Save" button
  - assert: page shows saved

  # -- Verify the change back in the Manage Info Records list ----------
  - Press the "Go" button
  - assert: the "Net Price" field contains ${NET_PRICE}

  # -- Out-of-band truth: the changed record as SAP's OData sees it -----
  # UI says saved; the API proves it. body_contains resolves ${VAR} too.
  #
  # API_INFORECORD_PROCESS_SRV (the standard S/4 API this originally named)
  # does not exist in this system's service catalog — confirmed against the
  # live catalog via datamaker-sap-cli, exact and prefix match both empty.
  # ZMM_PUR_INFO_RECORDS_MANAGE_SRV_0001 is the real service backing the
  # "Manage Info Records" Fiori app itself (same one the UI steps above
  # drive), so it verifies against the same system of record the UI wrote
  # to, not a same-named-in-theory API that was never actually deployed here.
  - assert_api:
      request: GET ${SAP_ODATA_BASE}/MM_PUR_INFO_RECORDS_MANAGE_SRV/C_PurInfoRecordWithOrg?$filter=Material%20eq%20'${MATERIAL}'
      status: 200
      body_contains: ${NET_PRICE}
