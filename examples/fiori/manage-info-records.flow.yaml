# SAP Fiori: change a purchasing info record and verify it — the classic
# "PTP Process Area BU Apps → Manage Info Records" test case, expressed in
# flowproof's ordinary web grammar. Fiori is a browser app, so `app: web`
# (the CDP driver); `app: sap` is SAP GUI (desktop) only.
#
# Every value that is test DATA travels as a ${VAR} reference: it resolves
# from the environment at record AND replay, and only the raw `${VAR}` is
# ever stored in the trace. The sibling suite.yaml mints these vars via
# mint-test-data.sh (env_from) before any flow runs — so the flow always
# targets a Material/Supplier/Plant combination that really exists in the
# connected SAP system.
#
# Quoted TARGETS ("Material", "Go", …) are text anchors matched against
# labels/aria-labels/placeholders — they never resolve ${VAR}. Label
# wording here is representative of a standard Fiori theme; if your
# system's labels differ, record with --json and the clarification payload
# will list the real fields on screen (see docs/self-help.md).
#
# The launchpad URL itself carries sap-client/sap-language as query params
# (same names the SAP GUI adapter's optional login.client/login.language
# use) — confirmed live: hitting the base URL alone 404s post-login on a
# real system, because the shell's actual bootstrap path only resolves
# once client/language are present on the request, not guessed at as a
# path suffix.
name: Manage info records - edit and verify
app: web
url: ${FIORI_BASE_URL}?sap-client=${SAP_CLIENT}&sap-language=${SAP_LANGUAGE}#Shell-home
steps:
  # -- Log in on the launchpad's login screen --------------------------
  - Type ${SAP_USER} into the "User" field
  - Type ${SAP_PASSWORD} into the "Password" field
  - Press the "Log On" button
  # Confirmed live against a real system via login-smoke.flow.yaml: "Home"
  # resolves from the shell's own tab label once authenticated, regardless
  # of whether the account has any tiles assigned.
  - Wait until page shows Home within 90s

  # -- Navigate: the real tile on this account's Home page -------------
  # Confirmed live: this account's "My Home" page has no "PTP Process
  # Area BU Apps" / "Manage Info Records" tiles at all - those names came
  # from an assumed manual test script, not this system's real catalog.
  # The actual tile is "Change Purchasing Info Record", one click away.
  # "Home" resolves from the shell's own tab label (see above) before the
  # tile area below it necessarily finishes rendering - confirmed live via
  # a diagnostic hitting ElementNotFound here without this wait.
  - Wait until page shows Change Purchasing Info Record within 20s
  - Click "Change Purchasing Info Record"
  # The tile opens the app to its own initial screen, titled "Change
  # Info Record: Initial Screen" - confirmed live. Assert against what
  # the screen actually says.
  - assert: "page shows Change Info Record: Initial Screen"

  # -- Search the standard info record by the minted test data ---------
  # This is transaction ME12 rendered through WebGUI, not a modern
  # OData list-report app: confirmed live, there is no "Go" button at
  # all, and Purchasing Org. is a real field the search needs (ME12
  # requires it unless searching by Info Record number directly) -
  # mint-test-data.sh now mints it from the same OData row. The search
  # fields themselves live inside the classic WebGUI's own same-origin
  # iframe (named "Application"), not the top-level page - confirmed
  # live via scene() - so each Type targets it explicitly rather than
  # relying on rules mode's plain-grammar element search, which only
  # looks at the top-level document.
  - Type ${MATERIAL} into the "Material" in the iframe "Application"
  - Type ${SUPPLIER} into the "Supplier" in the iframe "Application"
  - Type ${PURCHASING_ORG} into the "Purchasing Org." in the iframe "Application"
  - Type ${PLANT} into the "Plant" in the iframe "Application"
  - Press Enter
  # Confirmed live: when Material+Supplier+Purchasing Org+Plant match
  # EXACTLY one info record, ME12 skips the results list entirely and
  # opens the record directly in its editable detail screen, titled
  # "Change Info Record: General Data" - there is no results list to
  # click into and no separate "Edit" button, unlike a modern Fiori
  # list-report app. A single-shot assert can catch the iframe mid-reload
  # right after Enter triggers the real search round-trip - the same
  # reason "page shows Home" above waits instead of asserting once.
  # Reaching this exact title already proves the search matched exactly
  # one record (see above) - a further "page shows ${MATERIAL}" check
  # would fail regardless, since ${MATERIAL} lands in an <input>'s VALUE,
  # not its textContent; surface_text() (like any DOM text walk) does not
  # see a value there, only the surrounding label - confirmed live.
  - "Wait until page shows Change Info Record: General Data within 30s"

  # -- Make the field changes -------------------------------------------
  # Net Price and Minimum Order Quantity live on the "Purch. Org. Data 1"
  # tab, not the "General Data" tab the record opens on - confirmed live.
  # Every target here is inside the same classic WebGUI iframe as the
  # search fields above, so each needs the same explicit iframe grammar.
  - Click "Purch. Org. Data 1" in the iframe "Application"
  # "Replace ... with" has no framed grammar form (confirmed live) even
  # though its two halves individually do - expressed as Clear + Type.
  - Clear the "Net Price" field in the iframe "Application"
  - Type ${NET_PRICE} into the "Net Price" in the iframe "Application"
  - Clear the "Minimum Order Quantity" field in the iframe "Application"
  - Type 10 into the "Minimum Order Quantity" in the iframe "Application"

  # -- Save ------------------------------------------------------------
  - Press the "Save" button in the iframe "Application"
  - assert: page shows saved

  # -- Verify the change is reflected on the same screen -----------------
  # ME12 stays on this record's detail screen after Save rather than
  # returning to a search screen, so re-verifying is reading the same
  # screen again, not re-searching.
  - assert: the "Net Price" field in the iframe "Application" contains ${NET_PRICE}

  # -- Out-of-band truth: the changed record as SAP's OData sees it -----
  # UI says saved; the API proves it. body_contains resolves ${VAR} too.
  #
  # API_INFORECORD_PROCESS_SRV (the standard S/4 API this originally named)
  # does not exist in this system's service catalog — confirmed against the
  # live catalog via datamaker-sap-cli, exact and prefix match both empty.
  # ZMM_PUR_INFO_RECORDS_MANAGE_SRV_0001 is the real service backing the
  # "Manage Info Records" Fiori app itself (same one the UI steps above
  # drive), so it verifies against the same system of record the UI wrote
  # to, not a same-named-in-theory API that was never actually deployed here.
  - assert_api:
      request: GET ${SAP_ODATA_BASE}/MM_PUR_INFO_RECORDS_MANAGE_SRV/C_PurInfoRecordWithOrg?$filter=Material%20eq%20'${MATERIAL}'
      status: 200
      body_contains: ${NET_PRICE}
