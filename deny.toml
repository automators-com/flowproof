# cargo-deny configuration — dependency security gate (audit issue A6).
#
# Scope: this file configures ONLY the advisory check. CI runs
# `cargo deny check advisories` (see .github/workflows/audit.yml); the
# license / bans / sources checks are deliberately out of scope here so the
# gate stays a focused "is anything we depend on known-vulnerable?" alarm and
# does not fail on unrelated licensing policy.
#
# Behaviour (cargo-deny defaults, stated explicitly so the policy is readable
# without consulting the docs):
#   - vulnerabilities      -> always error
#   - unmaintained = "all" -> error, including transitive dependencies
#   - unsound    = "workspace"
#   - yanked     = "warn"

[advisories]
# ---------------------------------------------------------------------------
# Known backlog (A6 "ratchet"): advisories that already existed in the tree
# when the gate was introduced. They are ignored so the gate can go green and
# immediately block any NEW advisory, while the pre-existing ones are burned
# down in dedicated follow-up PRs — one per root-cause cluster. As each
# cluster PR lands it DELETES its own entries here, tightening the gate step
# by step until only genuinely-unfixable (unmaintained-upstream) items remain.
#
# Do not add to this list to silence a new finding: a new advisory should be
# fixed, not ignored. Every entry below is tracked and has an owner PR.
# ---------------------------------------------------------------------------
ignore = [
  # --- Cluster: zip extraction (zip 4.6.1). Cleared by the "zip bump" PR. ---
  { id = "RUSTSEC-2026-0367", reason = "zip: SUID/SGID bits preserved during extraction (privilege escalation); fixed by zip bump (A6)" },
  { id = "RUSTSEC-2026-0368", reason = "zip: ZipArchive::extract follows symlinks to targets outside the destination directory; fixed by zip bump (A6)" },
  { id = "RUSTSEC-2026-0369", reason = "zip: extract applies Unix permissions through symlinks without confining the target; fixed by zip bump (A6)" },

  # --- Cluster: quick-xml 0.37.5 (DoS). Cleared by the "quick-xml bump" PR. ---
  { id = "RUSTSEC-2026-0194", reason = "quick-xml: quadratic run time checking a start tag for duplicate attributes (DoS); fixed by quick-xml bump (A6)" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml: unbounded namespace-declaration allocation in NsReader (memory-exhaustion DoS); fixed by quick-xml bump (A6)" },

  # --- Cluster: crypto timing (ctutils). Cleared by the "ctutils" follow-up. ---
  { id = "RUSTSEC-2026-0385", reason = "ctutils: non-constant-time mask generation and u128 comparisons (timing side-channel); fixed by ctutils follow-up (A6)" },

  # --- Cluster: unmaintained crates. No upstream fix; cleared only by
  #     migrating/removing the crate. Lowest urgency, handled last. ---
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained-only; reaches us via serde_yaml; removed by the serde_norway migration (A6)" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (no fix available); transitive; revisit whether a maintained replacement is reachable (A6)" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained (no fix available); transitive via the vision/font stack; revisit upstream (A6)" },
]
