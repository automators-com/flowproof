    licence: mit
    tier: 2
    set: agents
    test_path: tests/
    pushed: 2026-07-30
    status: candidate
    note: >-
      Credential-free stdio MCP server, uv.lock pinned. Python >=3.13.

  # ---------------------------------------------------------------- declined
  # Recorded rather than dropped so prospect.sh's dedupe stops re-surfacing
