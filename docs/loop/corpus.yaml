# The corpus: public repositories flowproof tries to reproduce.
#
# POINTERS, NEVER VENDORED CODE. Each entry is {repo, sha, licence, tier, set}
# and is fetched at run time. Copying test code from a copyleft repository into
# this Apache-2.0 one is a defect no test catches and no reviewer notices, so
# the corpus records where to look and nothing more.
#
# The SHA is mandatory. A candidate without one is not evidence: the repository
# moves and the observation stops being reproducible.
#
# WHO WRITES WHAT
#   Prospector  appends candidates; never executes what it finds
#   Migrator    reads a candidate, runs it inside scripts/gate/sandbox-run.sh,
#               and sets status; never edits another entry
#   humans      widen the licence allowlist, and decline anything out of scope
#
# STATUS
#   candidate  recorded, not yet attempted
#   migrating  a Migrator holds it
#   agreed     migrated, verdicts matched, and proven non-vacuous by mutation
#   gap        flowproof could not express it - see docs/loop/ledger.yaml
#   false-green  flowproof PASSED where the original FAILED (priority 1, always)
#   declined   with declined_why, so it is not re-proposed every time it is seen
#
# SET - which job the candidate serves. Mandatory. The tier says what KIND of
# thing a candidate is; the set says which lane it is in, and the two lanes have
# different preconditions, so a single undifferentiated pool cannot express the
# state the engine is actually in. The cleavage is the `agent` adapter against
# all the others.
#
#   agents     tier 2 - agents and MCP servers. app: agent.
#              BLOCKED on the record leg: it needs a real model reachable from
#              inside sandbox-run.sh, and the sandbox passes no environment in
#              by design. Entries here are worth recording and will sit at
#              `candidate` until that is solved.
#   adapters   tier 3 - web UI suites (Cypress, Playwright, Selenium, plain
#              HTML), app: web; and tier 1 - API/HTTP suites, app: api.
#              RUNNABLE TODAY. Tier 3 carries one extra guard: the original
#              must pass 3x consecutively before it counts as an oracle
#              (CHARTER.md section 3). A suite that cannot is declined, and
#              that is a finished turn rather than a gap.
#
# Tier 4 (desktop/SAP/Citrix) is an adapter and still does not go in `adapters`:
# the set is a PROSPECTING lane, and there is no public corpus of SAP or Windows
# suites to prospect. It is never autonomous.
#
# Prospect `adapters` while `agents` is blocked. A candidate in a blocked lane
# is not worthless, but it is not work either, and until 2026-07-30 the queue
# could not tell those apart - a blocked record leg presented as a dry queue.

version: 1
candidates:
  # ------------------------------------------------------- adapters (tier 3)
  # From a SUPERVISED turn on 2026-07-30, run by a human rather than by the
  # fleet: prospect.sh surfaced the candidates and migrate.sh established the
  # baseline, but no Prospector or Migrator model turn was spent. Recorded here
  # because the measurement is what the next turn should start from, and
  # because what it found is worse than "it did not work".

  - repo: cypress-io/cypress-example-kitchensink
    sha: 9642cc1d45480073f5197fe9e43b0cbb0471fc8b
    licence: mit
    tier: 3
    set: adapters
    test_path: cypress/e2e/
    pushed: 2026-07-28
    status: candidate
    note: >-
      The canonical self-contained Cypress example: the application and its
      suite in one repository, so nothing third-party has to be stood up. The
      right shape for the first adapters migration.
    # BLOCKED, and the first blocker was a defect in migrate.sh rather than in
    # this repository. Left as `candidate`, not `declined`: nothing here is
    # wrong.
    migrator_note: >-
      Attempted 2026-07-30. The first run printed FAIL for a suite that had
      executed nothing: Cypress caches its browser under $HOME, which is the
      image and does not survive into the replay container. FAIL is a usable
      oracle by migrate.sh's contract, so that was a false oracle - the same
      defect #235 fixed for Python, in the Node path. Fixed in #243, which
      pins the cache into /work and adds a replay-phase probe that asks whether
      the runner starts before any verdict is trusted.
      With that fix the honest verdict is UNRUNNABLE, and .probe.log says why:
      node:22-bookworm-slim has no Xvfb, so it cannot run Cypress at all.
      Confirmed not an over-decline - `npm test` in the same container also
      fails, exit 134, JavaScript heap out of memory against SANDBOX_MEM=2g on
      a host with ~1.3 GB free. So TWO things stand between this entry and an
      oracle, and they are separate decisions: an image carrying Xvfb and the
      GUI libraries (Cypress ships cypress/included), and enough memory to run
      a browser. Neither is a defect in this repository. Left as `candidate`.

  # Surfaced by the same prospect.sh run and not attempted. Recorded so the
  # next turn starts from a shortlist rather than a search, and so the SHAs are
  # pinned at the moment they were seen.
  - repo: pactflow/example-consumer-cypress
    sha: 90937475e94a9a4957e203527564fc56ac17a04c
    licence: mit
    tier: 3
    set: adapters
    pushed: 2026-07-27
    status: candidate
    note: >-
      Small Cypress consumer suite. Untried. The Cypress cache defect that
      broke kitchensink is fixed (#243), so this one should reach a real
      verdict once the image carries Xvfb.

  - repo: pactflow/example-bi-directional-consumer-playwright-js
    sha: d00397fad8c835cd75888a47f6fdf20ccf45d41d
    licence: mit
    tier: 3
    set: adapters
    pushed: 2026-07-27
    status: candidate
    note: >-
      The Playwright half of the lane, so the first migration is not measured
      against one framework alone. Playwright caches browsers under
      $HOME/.cache/ms-playwright, the same phase-boundary problem Cypress had.
      #243 sets PLAYWRIGHT_BROWSERS_PATH into /work BY ANALOGY and did not
      measure it - this entry is how that gets measured. If the analogy is
      wrong the probe reports UNRUNNABLE, which is the safe direction.

  # ------------------------------------------------------- agents (tier 2)
  # Three entries, and the shortlist was 12. The filter that did the work was
  # not the licence check - it was asking, per repository, what a Migrator
  # would actually have to install. See the declined block below for what that
  # removed and why.

  # The agent half of Tier 2: a process that calls a model, which is what
  # `app: agent` records. `api_base` in extra-openai-models.yaml points the
  # OpenAI dialect at an arbitrary URL, which is exactly flowproof's
  # interception point - no patching of the system under test required.
  # test_tools.py and test_tools_streaming.py mean there are real
  # function-calling trajectories to assert on, not prose to regex, and the
  # streaming pair speaks directly to milestone 2 criterion 2.
  - repo: simonw/llm
    sha: 5aa61fc6335d365306a68183435c71819b7e2de8
    licence: apache-2.0
    tier: 2
    set: agents
    test_path: tests/
    pushed: 2026-07-30
    status: candidate
    note: >-
      Model-calling CLI with tool support. Records via api_base override;
      tests/cassettes shows the project already thinks in recordings.
    # Attempted 2026-07-30. Everything up to the record leg is measured and
    # good; the record leg itself did not run, and the reason is not in this
    # repository. Left as `candidate` because the status vocabulary has no term
    # for "attempted, blocked on something outside the corpus" - it is not
    # declined (in scope, and cheap once unblocked) and not agreed (nothing was
    # recorded). Kept here so the next turn starts from the measurement.
    migrator_note: >-
      Oracle is PASS: 950 tests, 0 failed, egress denied, at this SHA. The
      Prospector's api_base claim holds and is cheaper than claimed - llm
      passes no base_url for a built-in model, so the openai SDK falls back to
      OPENAI_BASE_URL and flowproof's injected value is honoured with no
      config file at all. `flowproof doctor` under --network=none: 1 model
      request reached the proxy, so nothing can have gone to a real provider.
      On the wire llm sends `"stream": true` by default (`--no-stream` gives
      `"stream": false`) and NO system message. BLOCKED at record: the record
      leg needs a real model, and no model credential exists on this box.
      Recording against a scripted responder is refused in-tree
      (tests/flowproof/spike/README.md).

  # The `mcp:` lane over BOTH transports: `python -m fetchaller.main` for
  # stdio, `--http` for streamable-HTTP. That second one is milestone 2
  # criterion 4, and it is the only candidate here that offers it without
  # credentials - the required MCP_API_KEY and JWT_SECRET are self-generated
  # (`openssl rand -hex 32`), and the third-party API keys are all optional.
  - repo: Averyy/fetchaller-mcp
    sha: 00a79e3c54ff952e32be5ce5e2549ba459c2be92
    licence: mit
    tier: 2
    set: agents
    test_path: tests/
    pushed: 2026-07-30
    status: candidate
    note: >-
      MCP server, stdio and streamable-HTTP. uv.lock pinned, ~75 test modules.
      Its tools fetch live URLs, so the record leg needs egress; replay does
      not, because flowproof answers from the mcp: lane.

  # Chosen for one property the others lack: it states it has no credentials
